name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend_focused
            command: seed_fleet
            port: 3000
          - app: frontend_focused
            command: seed_submissions
            port: 3001
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:ci-only-password@127.0.0.1:5432/app
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-random-looking-secret-never-used-in-a-deployed-system-12345
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:${{ matrix.port }}
      DEMO_PASSWORD: Local-demo-2026!
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/frontend/package-lock.json
      - name: Install backend tools
        working-directory: ${{ matrix.app }}/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Backend lint, migrations and PostgreSQL tests
        working-directory: ${{ matrix.app }}/backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python manage.py makemigrations --check --dry-run --settings=server.test_settings
          .venv/bin/coverage run manage.py test --settings=server.test_settings
          .venv/bin/coverage report --fail-under=80
          .venv/bin/pip-audit -r requirements.txt
          DJANGO_DEBUG=false .venv/bin/python manage.py check --deploy --fail-level WARNING
      - name: Frontend checks and build
        working-directory: ${{ matrix.app }}/frontend
        run: |
          npm ci --no-fund
          npm run check
          npm audit --omit=dev
          npm run build
          npx playwright install --with-deps chromium
      - name: Prepare test data and start applications
        working-directory: ${{ matrix.app }}
        run: |
          ./scripts/backend migrate --noinput
          ./scripts/backend ${{ matrix.command }}
          ./scripts/serve > /tmp/application.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:${{ matrix.port }}/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/application.log
          exit 1
      - name: Browser workflows and accessibility
        working-directory: ${{ matrix.app }}/frontend
        run: npm run test:e2e
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.app }}
          path: |
            ${{ matrix.app }}/frontend/test-results
            ${{ matrix.app }}/frontend/playwright-report
            /tmp/application.log
          retention-days: 7
